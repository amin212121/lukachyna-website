name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never let two deploys write to the server at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration production

      # Secrets are passed through env rather than interpolated into the script
      # body, so their values never land in the generated script on the runner.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync updates files in place (atomic per-file rename), so the site is
      # never missing from disk mid-deploy. --delete-after drops files that no
      # longer exist in the build, but only once every transfer has succeeded,
      # so a failed deploy cannot leave the site with assets already removed.
      - name: Deploy via rsync
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete-after --checksum --human-readable --stats \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/browser/ \
            "${SERVER_USER}@${SERVER_HOST}:/opt/apps/lukachyna.com/browser/"

      # Routes come from the build's own prerender manifest, so this check can
      # never drift from what was actually deployed.
      - name: Verify deployment
        shell: bash
        run: |
          failed=0
          while read -r path; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 -m 20 "https://lukachyna.com${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || { echo "::error::${path} returned ${code}, expected 200"; failed=1; }
          done < <(python3 -c "import json;print('\n'.join(json.load(open('dist/prerendered-routes.json'))['routes']))")

          type=$(curl -sSI -m 20 https://lukachyna.com/stepan_lukachyna_cv.pdf | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type"{print $2}')
          echo "/stepan_lukachyna_cv.pdf -> ${type}"
          case "$type" in application/pdf*) ;; *) echo "::error::CV is not served as a PDF (got '${type}')"; failed=1 ;; esac

          exit $failed

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
